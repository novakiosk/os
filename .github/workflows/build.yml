name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false
jobs:
  bluebuild:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate update helper
        run: python3 -m unittest discover -s tests -v
      - name: Build and sign daily OS image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13
        with:
          recipe: recipe.yml
          cli_version: v0.9.37
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'novakiosk/os' }}
          maximize_build_space: true
