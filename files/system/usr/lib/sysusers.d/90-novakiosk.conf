g kiosk -
u kiosk - "Kiosk user" /home/kiosk /bin/bash
g greeter -
u greeter - "Greetd greeter" /var/lib/greetd /sbin/nologin

g novakiosk-agent -
g novakiosk-ipc -
u novakiosk-agent - "NOVA Kiosk authority" /var/lib/novakiosk-agentd /sbin/nologin
m kiosk novakiosk-ipc
m novakiosk-agent novakiosk-ipc
