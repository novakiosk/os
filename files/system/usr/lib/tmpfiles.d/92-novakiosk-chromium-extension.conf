# Expose enterprise policies to the Flathub Chromium Flatpak
# (org.chromium.Chromium). Its org.chromium.Chromium.Extension extension point
# loads externally managed extensions from:
#   /var/lib/flatpak/extension/org.chromium.Chromium.Extension.<id>/<arch>/1/
#
# See: https://github.com/flathub/org.chromium.Chromium#extension-points

d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk/x86_64 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk/x86_64/1 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk/x86_64/1/policies 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk/x86_64/1/policies/managed 0755 root root -
r! /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk/x86_64/1/policies/managed/policies.json - - - - -
C /var/lib/flatpak/extension/org.chromium.Chromium.Extension.novakiosk/x86_64/1/policies/managed/policies.json 0644 root root - /usr/share/novakiosk/chromium/policies/managed/policies.json
